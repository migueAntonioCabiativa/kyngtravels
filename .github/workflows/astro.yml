name: Deploy Astro kyngtravels to hostinger page

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "." # default value when not using subfolders
  # BUILD_PATH: subfolder

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Normalize FTP connection settings
        id: ftp
        env:
          FTP_SERVER_RAW: ${{ secrets.FTP_SERVER }}
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const rawServer = process.env.FTP_SERVER_RAW?.trim() ?? "";

          if (!rawServer) {
            throw new Error("The FTP_SERVER secret is empty or not configured.");
          }

          const normalizedServer = /^[a-z][a-z0-9+.-]*:\/\//i.test(rawServer)
            ? rawServer
            : `ftps://${rawServer}`;

          const parsedServer = new URL(normalizedServer);
          const protocol = parsedServer.protocol.slice(0, -1).toLowerCase();

          if (!parsedServer.hostname) {
            throw new Error("Could not determine an FTP hostname from the FTP_SERVER secret.");
          }

          if (!["ftp", "ftps", "ftps-legacy"].includes(protocol)) {
            throw new Error(`Unsupported FTP protocol "${protocol}" in FTP_SERVER.`);
          }

          console.log(`server=${parsedServer.hostname}`);
          console.log(`protocol=${protocol}`);

          if (parsedServer.port) {
            console.log(`port=${parsedServer.port}`);
          }
          NODE

      - name: Deploy Astro
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ steps.ftp.outputs.protocol }}
          port: ${{ steps.ftp.outputs.port }}
          local-dir: ./dist/
          server-dir: ./public_html/

